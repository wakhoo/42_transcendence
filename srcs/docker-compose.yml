name: ft_transcendence

# ============================================================
#  Services
# ============================================================
services:

  # ----------------------------------------------------------
  #  WAF — Nginx + ModSecurity
  #  Only container with external ports open
  # ----------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    networks:
      - dmz
      - internal
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./srcs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./srcs/nginx/modsecurity:/etc/nginx/modsecurity:ro
      - ./srcs/nginx/certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend
    env_file: .env
    restart: unless-stopped
    healthcheck:
      # Ensures the container is not just running but actually ready to accept connections before dependent services start.
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  #  Frontend — React (Vite)
  #  No external port — accessed through WAF only
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - internal
    env_file: .env
    restart: unless-stopped
    healthcheck:
      # Ensures the container is not just running but actually ready to accept connections before dependent services start.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  #  Backend — Next.js (API Routes)
  #  Connected to internal + db + vault networks
  #  No external port — accessed through WAF only
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    networks:
      - internal
      - db
      - vault_net
    depends_on:
      mariadb:
        condition: service_healthy
      # vault:
      #   condition: service_healthy
    env_file: .env
    restart: unless-stopped
    healthcheck:
      # Ensures the container is not just running but actually ready to accept connections before dependent services start.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  #  WebSocket — Real-time server
  #  No external port — accessed through WAF only
  # ----------------------------------------------------------
  websocket:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    container_name: websocket
    networks:
      - internal
    depends_on:
      - backend
    env_file: .env
    restart: unless-stopped
    healthcheck:
      # Ensures the container is not just running but actually ready to accept connections before dependent services start.
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  #  MariaDB — Database
  #  db network only — no external access
  # ----------------------------------------------------------
  mariadb:
    build:
      context: ./mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    networks:
      - db
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file: .env
    restart: unless-stopped
    healthcheck:
      # Ensures the container is not just running but actually ready to accept connections before dependent services start.
      test: ["CMD", "mariadb-admin", "ping", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------
  #  HashiCorp Vault — Secret management
  #  vault_net only — backend access only
  # ----------------------------------------------------------
  # vault:
  #   build:
  #     context: ./srcs/vault
  #     dockerfile: Dockerfile
  #   container_name: vault
  #   networks:
  #     - vault_net
  #   volumes:
  #     - vault_data:/vault/data
  #     - ./srcs/vault/config:/vault/config:ro
  #   env_file: .env
  #   cap_add:
  #     - IPC_LOCK
  #   restart: unless-stopped
  #   healthcheck:
  #     # Ensures the container is not just running but actually ready to accept connections before dependent services start.
  #     test: ["CMD", "vault", "status"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5


# ============================================================
#  Networks — 4-layer isolation
# ============================================================
networks:
  dmz:
  internal:
  db:
  vault_net:

# ============================================================
#  Volumes — bind mount to host path (Inception style)
# ============================================================
volumes:
  mariadb_data:
    driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /home/dancel/data/mariadb

  vault_data:
    driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /home/dancel/data/vault
