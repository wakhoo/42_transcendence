name: ft_transcendence



# ============================================================
#  Services
# ============================================================
services:

  # ----------------------------------------------------------
  #  WAF — Nginx + ModSecurity
  #  Only container with external ports open
  #  Healthcheck
  #  Ensures the container is not just running but actually ready 
  #  to accept connections before dependent services start.
  # ----------------------------------------------------------
  nginx:
    build:
      context: ./srcs/nginx
      dockerfile: Dockerfile
    container_name: nginx
    networks:
      - dmz
      - internal
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./srcs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./srcs/nginx/modsecurity:/etc/nginx/modsecurity:ro
      - ./srcs/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  #  Frontend — React (Vite)
  #  No external port — accessed through WAF only
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./srcs/frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - internal
    environment:
      - VITE_API_URL=${VITE_API_URL:-https://localhost/api}
      - VITE_WS_URL=${VITE_WS_URL:-wss://localhost/ws}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  #  Backend — Next.js (API Routes)
  #  Connected to internal + db + vault networks
  #  No external port — accessed through WAF only
  # ----------------------------------------------------------
  backend:
    build:
      context: ./srcs/backend
      dockerfile: Dockerfile
    container_name: backend
    networks:
      - internal
      - db
      - vault_net
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT:-8080}
      # Database — use container name, not localhost
      - DB_HOST=mariadb
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # # JWT
      # - JWT_SECRET=${JWT_SECRET}
      # - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-3600}
      # # Vault
      # - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      # - VAULT_TOKEN=${VAULT_TOKEN}
      # # OAuth
      # - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID}
      # - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET}
      # - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID}
      # - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET}
      # # 2FA
      # - TOTP_ISSUER=${TOTP_ISSUER:-ft_transcendence}
      # Next.js
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://localhost}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      mariadb:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  #  WebSocket — Real-time server (Next.js custom server)
  #  No external port — accessed through WAF only
  # ----------------------------------------------------------
  websocket:
    build:
      context: ./srcs/websocket
      dockerfile: Dockerfile
    container_name: websocket
    networks:
      - internal
    environment:
      - PORT=${WS_PORT:-9000}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  #  MariaDB — Database
  #  db network only — no external access
  # ----------------------------------------------------------
  mariadb:
    image: mariadb:11
    container_name: mariadb
    networks:
      - db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./srcs/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  #  HashiCorp Vault — Secret management
  #  vault_net only — backend access only
  # ----------------------------------------------------------
  # vault:
  #   build:
  #     context: ./srcs/vault
  #     dockerfile: Dockerfile
  #   container_name: vault
  #   networks:
  #     - vault_net
  #   environment:
  #     - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
  #     - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN}
  #   volumes:
  #     - vault_data:/vault/data
  #     - ./srcs/vault/config:/vault/config:ro
  #   cap_add:
  #     - IPC_LOCK
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "vault", "status"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5


# ============================================================
#  Networks — 4-layer isolation
# ============================================================
networks:
  dmz:          # WAF only — exposed to internet
  internal:     # App services — no external access
  db:           # Database layer — backend only
  vault_net:    # Secret management — backend only

# ============================================================
#  Volumes — persistent data
# ============================================================
volumes:
  mariadb_data:
  vault_data: