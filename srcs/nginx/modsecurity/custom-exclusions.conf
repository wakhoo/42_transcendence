# ============================================================
#  ft_transcendence — project-specific CRS exclusions
#  IDs >= 1000000 (CRS convention reserved for local rules).
#  Loaded last so it can override CRS decisions for known-safe
#  paths in *this* app only. Keep this list narrow — add an
#  exclusion here only after confirming a real false positive
#  against a legitimate route, not speculatively.
# ============================================================

# Swagger UI (/api/docs) renders inline <script>/<style> tags by design.
# Scope the CRS's own IP-reputation/XSS collaborative-detection ctl to
# skip only this admin-facing documentation path, not the whole API.
SecRule REQUEST_URI "@beginsWith /api/docs" \
    "id:1000001,\
    phase:1,\
    t:none,\
    nolog,\
    pass,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS,\
    ctl:ruleRemoveTargetByTag=attack-xss;REQUEST_HEADERS"

# /socket.io upgrade handshake: Connection/Upgrade headers plus
# transport=polling|websocket query args can look unusual to CRS's
# protocol-enforcement rules (920xxx). Scope narrowly to this path.
SecRule REQUEST_URI "@beginsWith /socket.io" \
    "id:1000002,\
    phase:1,\
    t:none,\
    nolog,\
    pass,\
    ctl:ruleRemoveByTag=attack-protocol"

# Google OAuth callback: the `scope` query param Google appends
# (e.g. "...userinfo.profile...") contains the substring ".profile",
# which CRS rule 930120 (LFI: OS File Access Attempt) flags as an
# attempt to read a dotfile like ~/.profile. False positive on the
# legitimate OAuth scope string — drop just that target on this path.
SecRule REQUEST_URI "@beginsWith /api/auth/callback/google" \
    "id:1000003,\
    phase:1,\
    t:none,\
    nolog,\
    pass,\
    ctl:ruleRemoveTargetById=930120;ARGS:scope"
