# ============================================================
#  ft_transcendence — OWASP CRS setup
#  Derived from the packaged /etc/modsecurity/crs/crs-setup.conf
#  template. Only the directives we actually need to pin are kept
#  here — everything else uses the CRS's own sane defaults.
# ============================================================

SecAction \
 "id:900990,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.crs_setup_version=334"

# Paranoia level 1: standard CRS strength. Detects SQLi/XSS/RCE/LFI/RFI
# with a low false-positive rate on JSON APIs — the right default for
# an actively-changing REST/websocket backend like this one.
SecAction \
 "id:900000,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.paranoia_level=1"

SecAction \
 "id:900001,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.executing_paranoia_level=1"

# Anomaly scoring thresholds (CRS defaults) — a request/response is only
# blocked once its accumulated rule-match score crosses these; this is
# what keeps a single low-severity match from taking down a real user.
SecAction \
 "id:900110,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.inbound_anomaly_score_threshold=5,\
  setvar:tx.outbound_anomaly_score_threshold=4"

# Enforce blocking (not just scoring) once the anomaly threshold is hit.
SecAction \
 "id:900120,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.blocking_paranoia_level=1"

# Reported application/server names are neutralized — don't hand
# attackers a version fingerprint through CRS's own diagnostics.
SecAction \
 "id:900130,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:'tx.crs_validate_utf8_encoding=1'"

# Allow larger request bodies for legitimate JSON/game payloads while
# still bounding them — mirrors SecRequestBodyLimit in modsecurity.conf.
SecAction \
 "id:900140,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.max_num_args=1000,\
  setvar:tx.arg_name_length=200,\
  setvar:tx.arg_length=8000,\
  setvar:tx.total_arg_length=128000"
