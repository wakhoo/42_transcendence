# ============================================================
#  ft_transcendence — OWASP CRS setup
#  Derived from the packaged /etc/modsecurity/crs/crs-setup.conf
#  template. Only the directives we actually need to pin are kept
#  here — everything else uses the CRS's own sane defaults.
# ============================================================

SecAction \
 "id:900990,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.crs_setup_version=334"

SecAction \
 "id:900000,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.paranoia_level=1"

SecAction \
 "id:900001,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.executing_paranoia_level=1"

# CRS default GET/HEAD/POST/OPTIONS — widen the allowed method list
SecAction \
 "id:900141,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

SecAction \
 "id:900110,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.inbound_anomaly_score_threshold=5,\
  setvar:tx.outbound_anomaly_score_threshold=4"

SecAction \
 "id:900120,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.blocking_paranoia_level=1"

SecAction \
 "id:900130,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:'tx.crs_validate_utf8_encoding=1'"

SecAction \
 "id:900140,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.max_num_args=1000,\
  setvar:tx.arg_name_length=200,\
  setvar:tx.arg_length=8000,\
  setvar:tx.total_arg_length=128000"
