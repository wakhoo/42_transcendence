# ============================================================
#  ft_transcendence — nginx.conf
#  Nginx + ModSecurity WAF
#  Single entry point for all external traffic
# ============================================================

# Number of worker processes (auto = one per CPU core)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------
    #  Logging
    # --------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # --------------------------------------------------------
    #  Performance
    # --------------------------------------------------------
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # --------------------------------------------------------
    #  ModSecurity WAF
    #  Ensures all requests are inspected before reaching
    #  internal services — blocks SQLi, XSS, path traversal
    # --------------------------------------------------------
    # modsecurity on;
    # modsecurity_rules_file /etc/nginx/modsecurity/modsecurity.conf;

    # --------------------------------------------------------
    #  HTTP → HTTPS redirect
    #  Keeps port 80 open but forces HTTPS
    # --------------------------------------------------------
    server {
        listen 8080;
        server_name localhost;

        return 301 https://$host:8443$request_uri;
    }

    # --------------------------------------------------------
    #  HTTPS server — main entry point
    # --------------------------------------------------------
    server {
        listen 8443 ssl;
        server_name localhost;

        # ----------------------------------------------------
        #  SSL / TLS
        # ----------------------------------------------------
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols TLSv1.3;

        # SSL session cache for performance
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ----------------------------------------------------
        #  Security headers
        #  Applied to all responses from this server
        # ----------------------------------------------------

        # Force HTTPS for 1 year (prevents downgrade attacks)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Prevent clickjacking (no iframes allowed)
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Control referrer information sent to other sites
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content Security Policy — restrict resource loading
        # Adjust as needed when adding external CDNs or fonts
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:;" always;

        # ----------------------------------------------------
        #  Frontend — React (Vite)
        #  Serves static files and SPA routing
        # ----------------------------------------------------
        location / {
            proxy_pass http://frontend:3000;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        #  Backend API — Nest.js
        #  All /api routes forwarded to backend
        # ----------------------------------------------------
        location /api {
            proxy_pass http://backend:3000;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeout for long-running API calls
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------
        #  OAuth callbacks — Nest.js handles auth routes
        # ----------------------------------------------------
        location /auth {
            proxy_pass http://backend:3000;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        #  WebSocket — Real-time game and chat
        #  Upgrades HTTP connection to WebSocket protocol
        # ----------------------------------------------------
        location /ws {
            proxy_pass http://websocket:9000;

            # Required headers for WebSocket upgrade
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout — WebSocket connections stay open
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ----------------------------------------------------
        #  Static legal pages
        #  Accessible directly without going through backend
        # ----------------------------------------------------
        location /privacy-policy {
            proxy_pass http://frontend:3000/privacy-policy;
            proxy_set_header Host $host;
        }

        location /terms-of-service {
            proxy_pass http://frontend:3000/terms-of-service;
            proxy_set_header Host $host;
        }

        # ----------------------------------------------------
        #  Block common attack paths
        #  Extra layer on top of ModSecurity WAF
        # ----------------------------------------------------

        # Block access to hidden files (.env, .git, etc.)
        location ~ /\. {
            deny all;
            return 404;
        }

        # Block access to backup and config files
        location ~* \.(bak|conf|config|sql|ini|log|sh)$ {
            deny all;
            return 404;
        }
    }
}